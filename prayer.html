<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>守望花園 · 整理中</title>
<style>
  :root { --bg:#f3f8f1; --card:#ffffff; --ink:#26402a; --sub:#5f7a62; --accent:#4f8a45; --soft:#e3efe0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14201a; --card:#1c2b22; --ink:#e4f0e2; --sub:#9ab59d; --accent:#8ebe84; --soft:#26382c; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; padding-top: max(24px, env(safe-area-inset-top)); padding-bottom: max(24px, env(safe-area-inset-bottom));
  }
  .card {
    width: 100%; max-width: 420px; background: var(--card); border-radius: 24px;
    padding: 36px 28px 32px; text-align: center;
    box-shadow: 0 8px 30px rgba(40, 80, 50, .10);
  }
  svg { width: 200px; height: auto; display: block; margin: 0 auto 8px; }
  .sprout { transform-origin: 100px 150px; animation: sway 4s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
  @media (prefers-reduced-motion: reduce) { .sprout { animation: none; } }
  h1 { font-size: 24px; margin: 8px 0 10px; letter-spacing: .08em; }
  p { margin: 0; color: var(--sub); line-height: 1.8; font-size: 15px; }
  .tag { display: inline-block; margin: 16px 0 22px; padding: 6px 16px; border-radius: 999px; background: var(--soft); color: var(--accent); font-weight: 700; font-size: 14px; }
  a.btn { display: inline-block; padding: 12px 28px; border-radius: 999px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 700; font-size: 15px; }
  a.btn:active { opacity: .85; }
</style>
</head>
<body>
  <main class="card">
    <svg viewBox="0 0 200 170" role="img" aria-label="整理中的花園">
      <ellipse cx="100" cy="156" rx="78" ry="9" fill="#cfe3c9"/>
      <path d="M22 152 Q100 134 178 152 L178 160 Q100 168 22 160 Z" fill="#a98b6a"/>
      <g class="sprout">
        <path d="M100 150 C100 128 100 112 100 94" stroke="#4f8a45" stroke-width="5" stroke-linecap="round" fill="none"/>
        <path d="M100 112 C80 112 66 100 64 82 C84 80 98 92 100 112 Z" fill="#8ebe84"/>
        <path d="M100 100 C118 100 132 88 134 70 C114 68 102 80 100 100 Z" fill="#6aa25f"/>
      </g>
    </svg>
    <h1>花園整理中</h1>
    <div class="tag">靜候開放</div>
    <p>守望花園正在整理，<br>暫時無法進入。<br>開放之後，再一起為彼此禱告。</p>
    <p style="margin:6px 0 26px">謝謝你的耐心等候。</p>
    <a class="btn" href="./index.html">回首頁</a>
  </main>
</body>
</html>
